<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0f172a" />
  <title>آفلاین - Market Pulse</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fb;
           font-family: Tahoma, sans-serif; color: #0f172a; text-align: center; padding: 24px; }
    .box { max-width: 340px; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-size: 1.3rem; margin: 16px 0 8px; }
    p { color: #64748b; line-height: 1.9; margin: 0 0 20px; }
    button { background: #2563eb; color: #fff; border: 0; border-radius: 12px; padding: 12px 24px;
             font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <img src="/icons/icon-192.png" alt="" />
    <h1>اتصال به اینترنت برقرار نیست</h1>
    <p>قیمت‌ها فقط با اینترنت به‌روز می‌شوند. اتصال خود را بررسی کنید و دوباره تلاش کنید.</p>
    <button onclick="location.reload()">تلاش دوباره</button>
  </div>
</body>
</html>
